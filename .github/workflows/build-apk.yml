name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file from secrets
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" >> .env

      - name: Prebuild native android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Patch Gradle wrapper to 8.7 (AGP 8.6 compat)
        working-directory: android
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Patch expo-modules-core for AGP 8.6 publishing
        run: |
          FILE=node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
          # Inject singleVariant("release") {} so components.release exists
          if ! grep -q 'singleVariant' "$FILE"; then
            python3 - <<'PY'
import re, pathlib
p = pathlib.Path("node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle")
s = p.read_text()
patch = '''
android {
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}
'''
# Insert before the first `publishing {` block
s = s.replace("publishing {", patch + "\npublishing {", 1)
p.write_text(s)
print("Patched ExpoModulesCorePlugin.gradle")
PY
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: golf-society-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error