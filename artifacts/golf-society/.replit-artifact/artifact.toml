kind = "mobile"
previewPath = "/"
title = "Golf Society"
version = "1.0.0"
id = "artifacts/golf-society"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22223

[services.development]
run = "pnpm --filter @workspace/golf-society run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/golf-society", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/golf-society", "run", "serve" ]

[services.env]
PORT = "22223"
BASE_PATH = "/"
