workflows:
  android-apk-build:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        JAVA_VERSION: "17"
        NODE_VERSION: "20.18.0"
        EXPO_PUBLIC_SUPABASE_URL: "https://ffkrwdvevjuloyxnliga.supabase.co"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "YOUR_ANON_KEY_HERE"
    scripts:
      - name: Set up Environment
        script: |
          sdk use java 17.0.10-tem
          nvm use $NODE_VERSION
      - name: Install dependencies
        script: |
          npm install
      - name: Expo Prebuild
        script: |
          # This generates the native Android folder
          npx expo prebuild --platform android --no-install
      - name: Force Gradle 8.8 Compatibility
        script: |
          # 1. Downgrade Gradle from 8.10 to 8.8 (Fixes the SoftwareComponent error)
          cd android
          ./gradlew wrapper --gradle-version 8.8
          
          # 2. Fix Build Features
          echo "android.defaults.buildfeatures.buildconfig=true" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
