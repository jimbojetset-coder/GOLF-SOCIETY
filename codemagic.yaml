workflows:
  android-apk-build:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: "17"
      node: "20.18.0"
      vars:
        EXPO_PUBLIC_SUPABASE_URL: "[ffkrwdvevjuloyxnliga.supabase.co](https://ffkrwdvevjuloyxnliga.supabase.co)"
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Clean previous prebuild
        script: |
          rm -rf android ios

      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
