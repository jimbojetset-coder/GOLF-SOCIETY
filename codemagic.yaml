workflows:
  android-apk-build:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - supabase_keys
      vars:
        # These ensure we use the correct versions for Expo SDK 52
        JAVA_VERSION: "17"
        NODE_VERSION: "20.19.4"
        EXPO_PUBLIC_SUPABASE_URL: "https://ffkrwdvevjuloyxnliga.supabase.co"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "YOUR_ANON_KEY_HERE"
    scripts:
      - name: Set up Java
        script: |
          sdk use java 17.0.10-terurin
      - name: Install dependencies
        script: |
          npm install
      - name: Expo Prebuild
        script: |
          # We force a clean prebuild to generate the correct Android files
          npx expo prebuild --platform android --no-install
      - name: Fix Gradle Compatibility
        script: |
          # This line fixes the 'SoftwareComponent' error you saw
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
