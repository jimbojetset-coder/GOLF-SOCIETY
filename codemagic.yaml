workflows:
  android-apk-build:
    name: Android APK Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: "17"
      node: "20.18.0"
      vars:
        EXPO_PUBLIC_SUPABASE_URL: "[ffkrwdvevjuloyxnliga.supabase.co](https://ffkrwdvevjuloyxnliga.supabase.co)"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "YOUR_ANON_KEY_HERE"
    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Expo Prebuild
        script: |
          npx expo prebuild --platform android --no-install

      - name: Fix Gradle Property Error
        script: |
          cd android
          echo "android.defaults.buildfeatures.buildconfig=true" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties

      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
